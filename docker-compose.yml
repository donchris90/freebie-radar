services:
  postgres:
    container_name: freebie-radar-postgres
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: freebie_radar
    ports: ["5434:5432"]
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    container_name: freebie-radar-redis
    image: redis:7
    ports: ["6381:6379"]
volumes:
  pgdata:
